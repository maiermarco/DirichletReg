name: R CMD check and Code Coverage

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['release', 'devel']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::Formula, any::maxLik, any::rgl, any::knitr, any::rmarkdown, any::formatR, any::testthat, any::covr, any::xml2
          needs: check
      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran", "--timings")'
          error-on: '"error"'
          check-dir: '"check"'
      - name: Code coverage
        if: ${{ matrix.r-version == 'release' }}
        run: |
          library(covr)
          codecov(quiet = FALSE)
        shell: Rscript {0}
